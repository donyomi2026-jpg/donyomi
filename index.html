/* Layout: 食券紙の地に、上部固定のタブ。1カラム（最大1120px）で、店一覧だけ2〜3列のグリッド */
/* ==========================================================================
   ドンヨミ Design Tokens  v1.0
   二郎系ラーメン専門サイト / PWA
   - ライト: 生成りの食券紙 × 醤油 × 食券機の赤ボタン
   - ダーク: 夜の行列、湯気の立つカウンター
   使い方: <html> に data-theme="light" | "dark" を付けると手動切替。
           未指定なら OS 設定 (prefers-color-scheme) に従う。
   ========================================================================== */

:root {
  color-scheme: light;

  /* ---------- Surface / Ink ---------- */
  --bg:            #F6F0E4;  /* 生成りの食券紙 */
  --bg-sunken:     #EDE4D3;
  --surface:       #FFFCF6;  /* カード */
  --surface-2:     #F1E9DA;  /* 入れ子・入力欄 */
  --surface-raised:#FFFFFF;
  --ink:           #1E1813;  /* 本文 (on --bg 15.5:1) */
  --ink-muted:     #5A4E42;  /* 補足 (on --bg 7.1:1) */
  --ink-subtle:    #6C5F51;  /* 注記・プレースホルダ (on --bg 5.4:1) */
  --ink-inverse:   #FFF8EE;
  --line:          #DCCFBA;  /* 区切り線 */
  --line-strong:   #958670;  /* 入力枠・チップ枠 (on --bg 3.1:1, UI 要件) */

  /* ---------- Brand ---------- */
  --primary:        #7A3414;  /* 醤油 / カラメ。主要ボタン (8.5:1) */
  --primary-hover:  #652A0F;
  --primary-soft:   #F3E1D3;
  --on-primary:     #FFF8EE;
  --accent:         #B8281A;  /* 食券機の赤ボタン。CTA・強調 (white 6.3:1) */
  --accent-hover:   #9C1F13;
  --accent-soft:    #F8DDD6;
  --on-accent:      #FFFFFF;
  --focus-ring:     #1A63C0;  /* フォーカスは色相を変えて確実に視認 */

  /* ---------- Ingredient palette (イラスト・アイコン用) ---------- */
  --c-yasai:        #6E9A34;  /* キャベツ */
  --c-yasai-dark:   #3F6A1C;
  --c-moyashi:      #F4EFD9;  /* もやし */
  --c-moyashi-line: #CBBF96;
  --c-ninniku:      #EFE6CC;  /* 刻みニンニク */
  --c-ninniku-dark: #B9A774;
  --c-abura:        #F6E7B8;  /* 背脂 */
  --c-abura-shine:  #FFFBEA;
  --c-karame:       #5A240C;  /* カラメ醤油 */
  --c-broth:        #B9773A;  /* 乳化スープ */
  --c-broth-light:  #D9A061;
  --c-pork:         #A9573A;  /* 豚 (赤身) */
  --c-pork-fat:     #F1D3BC;  /* 豚 (脂身) */
  --c-noodle:       #E2C27A;  /* 極太麺 */
  --c-bowl:         #2B2420;  /* 丼 */
  --c-bowl-rim:     #F2EBDD;
  --c-bowl-band:    #B8281A;  /* 丼の帯 (単色) */
  --c-steam:        rgba(255, 255, 255, 0.85);
  --c-steam-line:   rgba(90, 78, 66, 0.35);
  --c-outline:      #1E1813;  /* イラスト輪郭線 */

  /* ---------- Topping text colors (文字で使う時はこちら: AA 4.5:1 以上) ---------- */
  --t-yasai:   #3F6A1C;  /* 6.2:1 on --surface */
  --t-ninniku: #77662F;  /* 5.5:1 */
  --t-abura:   #8A6410;  /* 5.2:1 */
  --t-karame:  #5A240C;  /* 12:1 */

  /* ---------- Call level (なし→マシマシ, 量の順序尺度) ---------- */
  --lv-0: #E6DDCD;  /* なし     */
  --lv-1: #E9C9A5;  /* 少なめ   */
  --lv-2: #D9965C;  /* 普通     */
  --lv-3: #B9531F;  /* マシ     */
  --lv-4: #7A2410;  /* マシマシ */
  --on-lv-0: #1E1813; --on-lv-1: #1E1813; --on-lv-2: #1E1813;
  --on-lv-3: #FFFFFF; --on-lv-4: #FFFFFF;

  /* ---------- Taste axes (レーダー/バー。5軸を区別) ---------- */
  --taste-salty:  #B8281A;  /* しょっぱさ */
  --taste-rich:   #B9773A;  /* こってり/乳化 */
  --taste-noodle: #9A7A1E;  /* 麺の存在感 */
  --taste-pork:   #A9573A;  /* 豚 */
  --taste-volume: #3F6A1C;  /* 量 */
  --chart-fill:   rgba(184, 40, 26, 0.18);
  --chart-stroke: #B8281A;
  --chart-grid:   #DCCFBA;
  --chart-axis:   #6C5F51;

  /* ---------- Status ---------- */
  --success: #2F6B2A; --success-soft: #DDEBD3;
  --warning: #8A5A00; --warning-soft: #F7E7C2;
  --danger:  #B3261E; --danger-soft:  #F7DAD6;
  --info:    #1F5FA8; --info-soft:    #DCE7F5;

  /* ---------- Pattern ---------- */
  --pattern-ink:     rgba(122, 52, 20, 0.07);
  --pattern-opacity: 1;

  /* ---------- Typography ---------- */
  --font-display: "Dela Gothic One", "Hiragino Kaku Gothic StdN", "Yu Gothic", sans-serif;
  --font-body:    "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  --font-num:     "Zen Kaku Gothic New", system-ui, sans-serif; /* + font-variant-numeric: tabular-nums */

  --fs-xs:   0.75rem;   /* 12 注記 */
  --fs-sm:   0.875rem;  /* 14 補足・チップ */
  --fs-md:   1rem;      /* 16 本文 (スマホ最小) */
  --fs-lg:   1.125rem;  /* 18 リード */
  --fs-xl:   1.375rem;  /* 22 h3 */
  --fs-2xl:  1.75rem;   /* 28 h2 */
  --fs-3xl:  clamp(2rem, 7vw, 3rem);    /* h1 */
  --fs-hero: clamp(2.5rem, 11vw, 4.5rem);

  --fw-regular: 400; --fw-medium: 500; --fw-bold: 700; --fw-black: 900;
  --lh-tight: 1.25; --lh-snug: 1.45; --lh-body: 1.75;
  --ls-display: 0.02em; --ls-label: 0.06em;

  /* ---------- Spacing (4px base) ---------- */
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;
  --sp-12: 48px; --sp-16: 64px;
  --gutter: 16px;            /* スマホ左右余白 */
  --content-max: 720px;      /* 本文最大幅 */
  --layout-max: 1120px;
  --tap-min: 44px;           /* タップ領域の最小 */

  /* ---------- Radius ---------- */
  --r-xs: 4px;    /* タグ・バッジ */
  --r-sm: 8px;    /* 入力・小ボタン */
  --r-md: 12px;   /* ボタン・チップ群 */
  --r-lg: 16px;   /* カード */
  --r-xl: 24px;   /* シート・モーダル */
  --r-pill: 999px;
  --r-ticket: 6px;/* 食券型カード (角は小さく、切り欠きで表現) */

  /* ---------- Shadow (暖色寄りの影) ---------- */
  --shadow-1: 0 1px 2px rgba(60, 35, 15, 0.08), 0 1px 1px rgba(60, 35, 15, 0.04);
  --shadow-2: 0 2px 6px rgba(60, 35, 15, 0.10), 0 8px 20px rgba(60, 35, 15, 0.06);
  --shadow-3: 0 6px 16px rgba(60, 35, 15, 0.14), 0 18px 40px rgba(60, 35, 15, 0.10);
  --shadow-press: inset 0 2px 0 rgba(0, 0, 0, 0.18); /* 食券ボタン押下 */
  --shadow-button: 0 3px 0 var(--primary-hover);     /* 食券機ボタンの厚み */
  --shadow-button-accent: 0 3px 0 var(--accent-hover);

  /* ---------- Border ---------- */
  --bw: 1px; --bw-strong: 2px;

  /* ---------- Motion ---------- */
  --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
  --ease-pop: cubic-bezier(0.34, 1.56, 0.64, 1);
  --dur-fast: 120ms; --dur-base: 200ms; --dur-slow: 360ms;

  /* ---------- Z-index ---------- */
  --z-header: 50; --z-sheet: 80; --z-toast: 100;
}

/* ---------- Base ---------- */
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background-color: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--fs-md);
  line-height: var(--lh-body);
  font-feature-settings: "palt" 0;
  -webkit-font-smoothing: antialiased;
}
h1, h2, .display {
  font-family: var(--font-display);
  font-weight: 400;              /* Dela Gothic One は単一ウェイト */
  line-height: var(--lh-tight);
  letter-spacing: var(--ls-display);
  font-feature-settings: "palt" 1;
}
h3, h4 { font-family: var(--font-body); font-weight: var(--fw-black); line-height: var(--lh-snug); }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: var(--fw-bold); }
:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 2px; }

/* 背景パターン (pattern.svg をインライン化して url() に入れるか、CSS mask で着色) */
.bg-pattern {
  position: relative;
  isolation: isolate;
}
.bg-pattern::before {
  content: "";
  position: absolute; inset: 0; z-index: -1;
  background-color: var(--pattern-ink);
  -webkit-mask: url("pattern.svg") repeat 0 0 / 160px 160px;
          mask: url("pattern.svg") repeat 0 0 / 160px 160px;
  pointer-events: none;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}


*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:var(--fs-md);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
a{color:var(--primary)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus-ring);outline-offset:2px}
.wrap{max-width:var(--layout-max);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:var(--z-header);background:var(--surface);border-bottom:var(--bw) solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:var(--sp-3);padding-block:8px;flex-wrap:wrap}
.logo{display:flex;align-items:center;text-decoration:none;flex:none}
.logo svg{height:36px;width:auto;display:block}
.tabs{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{display:inline-flex;align-items:center;min-height:40px;padding:0 12px;border-radius:var(--r-sm);text-decoration:none;color:var(--ink-muted);font-weight:var(--fw-bold);font-size:var(--fs-sm);white-space:nowrap}
.tabs a[aria-current="page"]{background:var(--primary);color:var(--on-primary)}
@media (max-width:560px){.top .wrap{gap:4px}.tabs{margin-left:0;width:100%}.tabs a{flex:1;justify-content:center;padding:0 6px}}

main{padding-block:var(--sp-6) var(--sp-16)}
section+section{margin-top:var(--sp-10)}
h1,h2{font-family:var(--font-display);font-weight:400;line-height:var(--lh-tight);letter-spacing:var(--ls-display);text-wrap:balance;margin:0}
h1{font-size:var(--fs-3xl)}
h2{font-size:var(--fs-xl)}
h3{font-size:var(--fs-lg);margin:0;font-weight:var(--fw-black)}
p{margin:0}
.lead{color:var(--ink-muted);font-size:var(--fs-lg);max-width:60ch}
.muted{color:var(--ink-muted)}
.small{font-size:var(--fs-sm)}
.xs{font-size:var(--fs-xs);color:var(--ink-subtle)}
.stack{display:flex;flex-direction:column;gap:var(--sp-4)}
.stack-s{display:flex;flex-direction:column;gap:var(--sp-2)}
.row{display:flex;gap:var(--sp-3);flex-wrap:wrap;align-items:center}
.label{font-size:var(--fs-xs);font-weight:var(--fw-bold);letter-spacing:var(--ls-label);color:var(--ink-subtle)}
.num{font-variant-numeric:tabular-nums}

/* 食券型カード：左右に切り欠き */
.ticket{position:relative;background:var(--surface);border-radius:var(--r-ticket);padding:var(--sp-5);box-shadow:var(--shadow-1);
  -webkit-mask:radial-gradient(circle 9px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 9px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat;
          mask:radial-gradient(circle 9px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 9px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat}
.panel{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-lg);padding:var(--sp-5)}
.perf{border:0;border-top:2px dashed var(--line);margin:var(--sp-4) 0}

/* hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:var(--sp-6);align-items:center}
.hero-art svg{width:100%;max-width:420px;height:auto;display:block;margin:0 auto}
.hero h1{font-size:var(--fs-hero)}
.hero h1 em{font-style:normal;color:var(--accent)}
@media (max-width:760px){.hero{grid-template-columns:1fr}.hero-art{order:-1}.hero-art svg{max-width:260px}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap-min);padding:0 18px;border-radius:var(--r-md);border:0;font-weight:var(--fw-black);cursor:pointer;text-decoration:none;transition:transform var(--dur-fast) var(--ease-out)}
.btn-primary{background:var(--primary);color:var(--on-primary);box-shadow:var(--shadow-button)}
.btn-accent{background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow-button-accent)}
.btn-ghost{background:var(--surface-2);color:var(--ink);border:var(--bw) solid var(--line-strong)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:var(--r-pill);font-size:var(--fs-xs);font-weight:var(--fw-bold);background:var(--surface-2);color:var(--ink-muted);border:var(--bw) solid var(--line);white-space:nowrap}
.chip-direct{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip-inspire{background:var(--primary-soft);color:var(--primary);border-color:transparent}
.chip-closed{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.chip-high{background:var(--success-soft);color:var(--success);border-color:transparent}
.chip-mid{background:var(--warning-soft);color:var(--warning);border-color:transparent}
.chip-low{background:var(--surface-2);color:var(--ink-subtle)}

/* 5段階の食券ボタン */
.lvl{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center}
.lvl-name{display:flex;align-items:center;gap:6px;font-weight:var(--fw-black);white-space:nowrap}
.lvl-name svg{width:24px;height:24px;flex:none}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.seg button{min-height:42px;border-radius:var(--r-sm);border:var(--bw) solid var(--line-strong);background:var(--surface);font-size:var(--fs-xs);font-weight:var(--fw-bold);cursor:pointer;padding:0 2px;line-height:1.2}
.seg button[aria-pressed="true"]{border-color:transparent;box-shadow:var(--shadow-press)}
.seg button[data-l="0"][aria-pressed="true"]{background:var(--lv-0);color:var(--on-lv-0)}
.seg button[data-l="1"][aria-pressed="true"]{background:var(--lv-1);color:var(--on-lv-1)}
.seg button[data-l="2"][aria-pressed="true"]{background:var(--lv-2);color:var(--on-lv-2)}
.seg button[data-l="3"][aria-pressed="true"]{background:var(--lv-3);color:var(--on-lv-3)}
.seg button[data-l="4"][aria-pressed="true"]{background:var(--lv-4);color:var(--on-lv-4)}
.seg.rate button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.t-yasai{color:var(--t-yasai)}.t-ninniku{color:var(--t-ninniku)}.t-abura{color:var(--t-abura)}.t-karame{color:var(--t-karame)}

/* 選択肢（一発コールの質問） */
.choices{display:flex;flex-wrap:wrap;gap:6px}
.choices button{min-height:42px;padding:0 14px;border-radius:var(--r-pill);border:var(--bw) solid var(--line-strong);background:var(--surface);font-weight:var(--fw-bold);cursor:pointer}
.choices button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.q{display:flex;flex-direction:column;gap:6px}

/* コール文 */
.callout{background:var(--ink);color:var(--bg);border-radius:var(--r-md);padding:var(--sp-4) var(--sp-5);display:flex;flex-direction:column;gap:6px}
.callout .say{font-family:var(--font-display);font-size:clamp(1.4rem,6vw,2.1rem);line-height:1.3;word-break:keep-all;overflow-wrap:anywhere}
.callout .xs{color:inherit;opacity:.75}

/* 味バー */
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:7em 1fr 3.2em;gap:10px;align-items:center;font-size:var(--fs-sm)}
.bar .track{height:12px;border-radius:var(--r-pill);background:var(--surface-2);position:relative;overflow:hidden;border:var(--bw) solid var(--line)}
.bar .fill{position:absolute;inset:0 auto 0 0;border-radius:var(--r-pill)}
.bar .base{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:var(--fw-bold)}
.bar.na .v{color:var(--ink-subtle);font-weight:400}

/* 店一覧 */
.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:var(--sp-2)}
.filters input,.filters select,.field select,.field input,.field textarea{min-height:var(--tap-min);border-radius:var(--r-sm);border:var(--bw) solid var(--line-strong);background:var(--surface);padding:0 12px;width:100%;min-width:0}
.field textarea{padding:10px 12px;min-height:80px;resize:vertical}
@media (max-width:600px){.filters{grid-template-columns:1fr 1fr}.filters .search{grid-column:1/-1}}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:var(--fs-sm);font-weight:var(--fw-bold);cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--primary)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:var(--sp-3)}
@media (max-width:420px){.lvl{grid-template-columns:84px 1fr}.seg button{font-size:11px}}
@media (max-width:360px){.grid{grid-template-columns:1fr}}
.shop{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;padding:var(--sp-4) var(--sp-5)}
.shop:hover{box-shadow:var(--shadow-2)}
.shop h3{font-size:var(--fs-md)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini div{display:flex;flex-direction:column;gap:3px}
.dots{display:flex;gap:3px}
.dots i{width:100%;height:6px;border-radius:2px;background:var(--surface-2);border:var(--bw) solid var(--line)}
.dots i.on{background:var(--lv-3);border-color:transparent}

/* 店詳細 */
.detail{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-4);align-items:start}
.detail>*{min-width:0}
@media (max-width:820px){.detail{grid-template-columns:1fr}}
dl.info{display:grid;grid-template-columns:6em 1fr;gap:6px 12px;margin:0;font-size:var(--fs-sm)}
dl.info dt{color:var(--ink-subtle);font-weight:var(--fw-bold)}
dl.info dd{margin:0;min-width:0;overflow-wrap:anywhere}
.flow{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:f}
.flow li{display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:var(--fs-sm)}
.flow li::before{counter-increment:f;content:counter(f);width:28px;height:28px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-weight:var(--fw-black);font-size:var(--fs-xs)}
.note{background:var(--warning-soft);color:var(--warning);border-radius:var(--r-sm);padding:10px 12px;font-size:var(--fs-sm)}
details summary{cursor:pointer;font-weight:var(--fw-bold);font-size:var(--fs-sm)}
.srcs{margin:8px 0 0;padding-left:1.2em;font-size:var(--fs-xs);overflow-wrap:anywhere}

/* 統計 */
.heat{overflow-x:auto}
.heat table{border-collapse:separate;border-spacing:4px;min-width:460px;width:100%}
.heat th{font-size:var(--fs-xs);font-weight:var(--fw-bold);color:var(--ink-subtle);text-align:center}
.heat th[scope="row"]{text-align:left}
.heat td{height:52px;border-radius:var(--r-sm);text-align:center;font-variant-numeric:tabular-nums;font-weight:var(--fw-black);font-size:var(--fs-sm)}
.legend{display:flex;align-items:center;gap:8px;font-size:var(--fs-xs);color:var(--ink-subtle)}
.legend span.g{flex:1;max-width:220px;height:10px;border-radius:var(--r-pill);background:linear-gradient(90deg,var(--info),var(--surface-2),var(--accent))}
table.rank{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
table.rank th{white-space:nowrap}
table.rank th,table.rank td{padding:8px 6px;border-bottom:var(--bw) solid var(--line);text-align:left}
table.rank td.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:var(--sp-6) var(--sp-4)}
.empty svg{width:140px;height:auto}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--info-soft,var(--surface-2));color:var(--ink);border-radius:var(--r-sm);padding:10px 12px;font-size:var(--fs-sm)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-4);align-items:start}
.two>*{min-width:0}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.road{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:var(--sp-3)}
.road .panel{display:flex;flex-direction:column;gap:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:var(--r-pill);font-weight:var(--fw-bold);z-index:var(--z-toast);font-size:var(--fs-sm)}
footer{border-top:var(--bw) solid var(--line);padding-block:var(--sp-6);color:var(--ink-subtle);font-size:var(--fs-xs)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.note-sample{background:var(--accent-soft);color:var(--ink);border:var(--bw) solid var(--accent);border-left-width:6px;font-size:var(--fs-md)}
.note-sample strong{color:var(--accent)}
.save-box{border-top:var(--bw) dashed var(--line-strong);padding-top:var(--sp-3)}
footer a{color:inherit}
.hint{margin:4px 0 0;color:var(--ink-muted)}
.gloss{border:var(--bw) dashed var(--line-strong);border-radius:var(--r-sm);padding:10px 14px}
.gloss summary{cursor:pointer;font-weight:var(--fw-bold);font-size:var(--fs-sm)}
.gloss dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 16px;margin:10px 0 0}
.gloss dt,.gloss-list dt{font-weight:var(--fw-bold)}
.gloss dd,.gloss-list dd{margin:0;font-size:var(--fs-sm);color:var(--ink-muted)}
.gloss-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:0}
.convo{display:flex;flex-direction:column;gap:6px;background:var(--accent-soft);border-radius:var(--r-md);padding:12px 16px}
.convo p{margin:0}
.convo .who{display:inline-block;min-width:5.5em;font-weight:var(--fw-bold);font-size:var(--fs-sm);color:var(--ink-muted)}
.convo .who.you{color:var(--accent)}
.breakdown{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:var(--fs-sm)}
.breakdown li{display:grid;grid-template-columns:7em 1fr;gap:8px;align-items:center}
.breakdown li>span:first-child{display:inline-flex;align-items:center;gap:4px;font-weight:var(--fw-bold)}
.breakdown svg{width:18px;height:18px}
.pred-box{border-top:var(--bw) dashed var(--line-strong);padding-top:var(--sp-3)}
.pred-words{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}.pred-words strong{white-space:nowrap}
.pred-words li{display:flex;justify-content:space-between;gap:8px;background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-sm);padding:6px 10px;font-size:var(--fs-sm)}
.guide-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.guide-steps li{display:flex;gap:14px;align-items:flex-start}
.guide-steps .num{flex:none;width:32px;height:32px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-family:var(--font-display)}
.guide-steps h3{margin:0 0 4px}
.guide-steps p{margin:0}
.hero-art svg{max-width:300px}
@media (max-width:760px){.hero-art svg{max-width:180px}}
@media (max-width:560px){.logo svg{height:26px}.top .wrap{padding-block:4px}.tabs a{min-height:36px;font-size:12px}}
.top.compact .logo svg{height:24px}
</style>

function samplePosts(){
  // 統計画面の見本用。保存はしない。決まった乱数で毎回同じ結果になる
  let seed = 7; const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
  const pool = SHOPS.filter(s=>s.taste && s.status!=='閉店');
  const out=[];
  for(let i=0;i<160;i++){
    const s = pool[Math.floor(rnd()*pool.length)];
    const c = {yasai:Math.floor(rnd()*5), ninniku:Math.floor(rnd()*5), abura:Math.floor(rnd()*4), karame:Math.floor(rnd()*4)};
    const b = baseTaste(s); const r={};
    AX.forEach(a=>{ let v=b[a.k]; TOPS.forEach(t=>v+=PRIOR[a.k][t.k]*(c[t.k]-DEF[t.k])*1.1); r[a.k]=Math.round(clamp(v+(rnd()-.5)*1.4)); });
    r.overall = Math.round(clamp(3.4 + (c.karame>=3?-.6:0) + (c.yasai>=4?-.4:0) + (c.ninniku>=2?.4:0) + (rnd()-.5)*1.6));
    out.push({shop:s.id, calls:c, ratings:r, finished: r.volume<=4 || rnd()>.5});
  }
  return out;
}
function activePosts(){ return SAMPLE ? (SAMPLE_POSTS ||= samplePosts()) : POSTS; }

function solve(A,b){ // ガウスの消去法
  const n=b.length; const M=A.map((r,i)=>[...r,b[i]]);
  for(let i=0;i<n;i++){
    let p=i; for(let r=i+1;r<n;r++) if(Math.abs(M[r][i])>Math.abs(M[p][i])) p=r;
    [M[i],M[p]]=[M[p],M[i]];
    if(Math.abs(M[i][i])<1e-9) return null;
    for(let r=0;r<n;r++){ if(r===i) continue; const f=M[r][i]/M[i][i]; for(let c=i;c<=n;c++) M[r][c]-=f*M[i][c]; }
  }
  return M.map((r,i)=>r[n]/r[i]);
}
const LAMBDA = 15; // 初期値への引き寄せの強さ（投稿約15件分）
function fitModel(posts){
  const model={};
  AX.forEach(a=>{
    const rows = posts.filter(p=>p.ratings && p.ratings[a.k]!=null && BY[p.shop]);
    // 説明変数: 切片 + 4トッピング（標準からの段数）。目的変数: 評価 − 口コミベース
    const k=5; const A=Array.from({length:k},()=>Array(k).fill(0)); const y=Array(k).fill(0);
    rows.forEach(p=>{
      const x=[1,...TOPS.map(t=>p.calls[t.k]-DEF[t.k])];
      const t = p.ratings[a.k]-baseTaste(BY[p.shop])[a.k];
      for(let i=0;i<k;i++){ y[i]+=x[i]*t; for(let j=0;j<k;j++) A[i][j]+=x[i]*x[j]; }
    });
    const prior=[0,...TOPS.map(t=>PRIOR[a.k][t.k])];
    for(let i=0;i<k;i++){ const l = i===0?5:LAMBDA; A[i][i]+=l; y[i]+=l*prior[i]; }
    const b = solve(A,y) || prior;
    // 店ごとのずれ（件数が少ないほど0に寄せる）
    const shopAdj={}; const acc={};
    rows.forEach(p=>{
      const x=TOPS.map(t=>p.calls[t.k]-DEF[t.k]);
      const pred = baseTaste(BY[p.shop])[a.k]+b[0]+x.reduce((s,v,i)=>s+v*b[i+1],0);
      (acc[p.shop] ||= {s:0,n:0}); acc[p.shop].s += p.ratings[a.k]-pred; acc[p.shop].n++;
    });
    Object.entries(acc).forEach(([id,o])=>shopAdj[id]={adj:o.s/(o.n+5), n:o.n});
    model[a.k]={b, shopAdj, n:rows.length};
  });
  return model;
}
POSTS = myEntries.filter(e=>BY[e.shop]);
let MODEL = fitModel(POSTS);
function predict(shop, calls){
  const base = baseTaste(shop); const out={};
  AX.forEach(a=>{
    const m=MODEL[a.k]; const adj = (m.shopAdj[shop?.id]||{adj:0}).adj;
    let v = base[a.k] + m.b[0] + adj;
    TOPS.forEach((t,i)=>v += m.b[i+1]*(calls[t.k]-DEF[t.k]));
    out[a.k]=clamp(v);
  });
  out.base = base;
  out.n = (MODEL.salty.shopAdj[shop?.id]||{n:0}).n;
  out.total = MODEL.salty.n;
  return out;
}
function pearson(xs,ys){
  const n=xs.length; if(n<3) return null;
  const mx=xs.reduce((a,b)=>a+b)/n, my=ys.reduce((a,b)=>a+b)/n;
  let sxy=0,sx=0,sy=0; for(let i=0;i<n;i++){const dx=xs[i]-mx,dy=ys[i]-my;sxy+=dx*dy;sx+=dx*dx;sy+=dy*dy}
  if(sx===0||sy===0) return null; return sxy/Math.sqrt(sx*sy);
}

    </form>
    <section class="stack-s">
      <h2>あなたの記録（この端末にだけ保存）</h2>
      ${myEntries.length? `<div class="tbl"><table class="rank"><thead><tr><th>日付</th><th>店</th><th>コール</th><th>満足</th><th></th></tr></thead><tbody>${[...myEntries].reverse().map(e=>`<tr><td class="num">${esc((e.at||'').slice(5,10).replace('-','/'))}</td><td>${esc(shortName(BY[e.shop]||{name:e.shop}))}</td><td>${esc(callText(e.calls))}</td><td class="n">${e.ratings.overall}</td><td><button class="btn btn-ghost" style="min-height:34px;padding:0 10px;font-size:var(--fs-xs)" data-del="${esc(e.id)}" type="button">削除</button></td></tr>`).join('')}</tbody></table></div>`
        : `<div class="empty">${EMPTY}<p class="muted small">まだ記録がありません。上の「この端末にメモとして保存」で、自分用に残せます。</p></div>`}
    </section>
  </section>`;
}
function bindPost(root){
  const upd=()=>{ root.querySelector('#psay').textContent=callText(form.calls); const s=BY[form.shop]; const pp=root.querySelector('#ppred'); if(s&&pp) pp.innerHTML=predBars(predict(s,form.calls)); };
  bindSeg(root,(key,l)=>{ if(key.startsWith('c-')){form.calls[key.slice(2)]=l;upd();} else form.ratings[key.slice(2)]=l+1; });
  root.querySelector('#p-shop').addEventListener('change',e=>{form.shop=e.target.value;render();});
  root.querySelector('#p-size').addEventListener('change',e=>form.size=e.target.value);
  root.querySelector('#p-men').addEventListener('change',e=>form.men=e.target.value);
  root.querySelector('#p-fin').addEventListener('change',e=>form.finished=e.target.checked);
  root.querySelector('#p-memo').addEventListener('input',e=>form.memo=e.target.value);
  root.querySelector('#pf').addEventListener('submit',e=>{
    e.preventDefault(); const msg=root.querySelector('#p-msg');
    if(!form.shop){ msg.textContent='店を選んでください。'; return; }
    const entry={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6), shop:form.shop, size:form.size, men:form.men, calls:{...form.calls}, ratings:{...form.ratings}, finished:form.finished, memo:form.memo.slice(0,100), at:new Date().toISOString()};
    const next=[...myEntries, entry].slice(-300);
    if(!saveLocal(next)){ msg.textContent='このブラウザでは保存できませんでした（プライベートモードや保存の制限が原因のことがあります）。'; return; }
    myEntries=next; syncLocal(); form.memo=''; toast('この端末に保存しました'); render();
  });
  root.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>{
    if(b.dataset.confirm!=='1'){ b.dataset.confirm='1'; b.textContent='本当に削除'; return; }
    const next=myEntries.filter(e=>e.id!==b.dataset.del);
    if(!saveLocal(next)){ toast('削除できませんでした'); return; }
    myEntries=next; syncLocal(); toast('削除しました'); render();
  }));
}

/* ---------- 画面：コール統計 ---------- */
let statShop='';
function viewStats(){
  const all=activePosts(); const P = statShop? all.filter(p=>p.shop===statShop) : all;
  const enough = P.length>=5;
  const corr = TOPS.map(t=>RATE_AX.concat([{k:'finished',name:'完食'}]).map(a=>{
    const xs=[],ys=[]; P.forEach(p=>{ const y = a.k==='finished' ? (p.finished?1:0) : p.ratings?.[a.k]; if(y!=null){xs.push(p.calls[t.k]);ys.push(y);} });
    return pearson(xs,ys);
  }));
  const cols = RATE_AX.concat([{k:'finished',name:'完食'}]);
  const cell = r=>{
    if(r==null) return '<td style="background:var(--surface-2);color:var(--ink-subtle)">—</td>';
    const a=Math.min(1,Math.abs(r)); const c = r>=0 ? 'var(--accent)' : 'var(--info)';
    const strong = a>0.45;
    return `<td style="background:color-mix(in srgb, ${c} ${Math.round(a*85)}%, var(--surface-2));color:${strong?'var(--on-accent)':'var(--ink)'}">${r>=0?'+':''}${r.toFixed(2)}</td>`;
  };
  const combos={}; P.forEach(p=>{const k=callText(p.calls); (combos[k] ||= {n:0,o:0,f:0,s:0}); const c=combos[k]; c.n++; c.o+=p.ratings.overall||0; c.f+=p.finished?1:0; c.s+=p.ratings.salty||0;});
  const rank = Object.entries(combos).filter(([,v])=>v.n>=(SAMPLE?3:1)).sort((a,b)=>(b[1].o/b[1].n)-(a[1].o/a[1].n)||b[1].n-a[1].n).slice(0,8);
  const M = SAMPLE ? (SAMPLE_MODEL ||= fitModel(activePosts())) : MODEL;
  return `
  <section class="stack">
    <div class="stack-s"><h1>コール統計</h1><p class="muted">コールの量と、実際に感じた味との相関です。+1に近いほど「多くコールするほど強く感じる」、−1に近いほど「多くするほど弱く感じる」を表します。</p></div>
    <div class="row">
      <div class="field" style="flex:1;min-width:220px"><select id="s-shop" aria-label="店で絞り込む">${shopOptions(statShop,true).replace('店を決めていない','すべての店')}</select></div>
      <label class="toggle"><input type="checkbox" id="s-sample" ${SAMPLE?'checked':''}>サンプルデータ（架空）で見る</label>
    </div>
    ${SAMPLE?'<div class="note note-sample" role="note"><strong>サンプル（架空のデータ）を表示中</strong><br>公開版にはまだ共有の記録がないため、仕組みを見るための架空の記録160件で計算しています。実際のお客さんの記録や、店の実際の傾向ではありません。</div>'
      :'<div class="banner">この端末に保存したあなたの記録だけで計算しています。</div>'}
    <div class="panel stack">
      <div class="row"><h2>相関マップ</h2><span class="small muted num" style="margin-left:auto">記録 ${P.length}件</span></div>
      ${enough? `<div class="heat"><table><thead><tr><th></th>${cols.map(c=>`<th scope="col">${c.name}</th>`).join('')}</tr></thead><tbody>
        ${TOPS.map((t,i)=>`<tr><th scope="row" class="t-${t.k}">${t.name}</th>${corr[i].map(cell).join('')}</tr>`).join('')}</tbody></table></div>
        <div class="legend"><span>−1</span><span class="g"></span><span>+1</span><span>（—は計算できない組み合わせ）</span></div>`
        : `<div class="empty">${EMPTY}<p>記録が5件たまると相関マップが表示されます（いま${P.length}件）。</p><div class="row" style="justify-content:center"><a class="btn btn-accent" href="#post">記録する</a><button class="btn btn-ghost" type="button" id="s-try">サンプルで見る</button></div></div>`}
    </div>
    <div class="two">
      <div class="panel stack-s">
        <h2>満足度が高いコール</h2>
        ${rank.length? `<div class="tbl"><table class="rank"><thead><tr><th>コール</th><th>件数</th><th>満足</th><th>完食率</th></tr></thead><tbody>${rank.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${v.n}</td><td class="n">${(v.o/v.n).toFixed(1)}</td><td class="n">${Math.round(v.f/v.n*100)}%</td></tr>`).join('')}</tbody></table></div>`
          : '<p class="small muted">記録が集まると、満足度の高いコールの組み合わせがここに並びます。</p>'}
      </div>
      <div class="panel stack-s">
        <h2>予測に使っている係数</h2>
        <p class="small muted">コールを1段階増やした時に、味がどれだけ動くかの推定値です。記録が少ないうちは仮の初期値に寄せ、増えるほど実際の記録の値になります。</p>
        <div class="tbl"><table class="rank"><thead><tr><th></th>${AX.map(a=>`<th>${a.name}</th>`).join('')}</tr></thead><tbody>
          ${TOPS.map((t,i)=>`<tr><th class="t-${t.k}">${t.name}</th>${AX.map(a=>`<td class="n">${(M[a.k].b[i+1]>=0?'+':'')+M[a.k].b[i+1].toFixed(2)}</td>`).join('')}</tr>`).join('')}
        </tbody></table></div>
        <p class="xs">反映している記録：${M.salty.n}件${SAMPLE?'（サンプル）':''}。計算方法：口コミから作った店ごとの基準値に、コールの段数×係数を足しています（リッジ回帰）。</p>
      </div>
    </div>
  </section>`;
}
function bindStats(root){
  root.querySelector('#s-shop').addEventListener('change',e=>{statShop=e.target.value;render();});
  const setS=v=>{SAMPLE=v; render();};
  root.querySelector('#s-sample').addEventListener('change',e=>setS(e.target.checked));
  root.querySelector('#s-try')?.addEventListener('click',()=>setS(true));
}

/* ---------- ルーター ---------- */
const app=document.getElementById('app');
let lastView='';
function route(){ const h=(location.hash||'#home').slice(1); return h||'home'; }
function render(){
  const v=route(); const scroll = v===lastView;
  let html, bind;
  if(v.startsWith('s-')){ const id=v.slice(2); html=viewShop(id); bind=r=>bindShop(r,id); }
  else if(v==='shops'){ html=viewShops(); bind=bindShops; }
  else if(v==='post'){ html=viewPost(); bind=bindPost; }
  else if(v==='stats'){ html=viewStats(); bind=bindStats; }
  else if(v==='guide'){ html=viewGuide(); bind=()=>{}; }
  else { html=viewHome(); bind=bindHome; }
  const y=window.scrollY;
  app.innerHTML=html; bind(app);
  document.querySelectorAll('.tabs a').forEach(a=>{ const on = a.dataset.v===v || (a.dataset.v==='shops'&&v.startsWith('s-')) || (a.dataset.v==='home'&&!['shops','post','stats','guide'].includes(v)&&!v.startsWith('s-')); on?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'); });
  if(scroll) window.scrollTo(0,y); else window.scrollTo(0,0);
  lastView=v;
}
window.addEventListener('hashchange',render);
const topEl=document.querySelector('header.top'); window.addEventListener('scroll',()=>topEl.classList.toggle('compact',window.scrollY>40),{passive:true});
render();

/* ---------- この端末の記録 ---------- */
function syncLocal(){ POSTS = myEntries.filter(e=>BY[e.shop]); MODEL = fitModel(POSTS); }
window.addEventListener('storage',e=>{ if(e.key===LS_KEY){ myEntries=loadLocal(); syncLocal(); render(); } });
})();
</script>
</body>
</html>
